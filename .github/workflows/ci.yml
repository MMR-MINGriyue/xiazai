name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.25"

jobs:
  go-test:
    name: Go test & build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download modules
        run: go mod download

      - name: Unit tests (engine + video + rate limit)
        run: |
          go test ./internal/protocol/sftp/ ./internal/protocol/ftp/ ./internal/ratelimit/ ./internal/videosvc/ ./pkg/util/ -count=1 -timeout 180s

      - name: Build CLI
        run: go build -o bin/gopeed${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/gopeed

      - name: Build API server
        run: go build -o bin/gopeed-api${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/api

      - name: Build host (browser native messaging)
        run: go build -o bin/host${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/host

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gopeed-bin-${{ matrix.os }}
          path: bin/gopeed*
          if-no-files-found: error

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub
